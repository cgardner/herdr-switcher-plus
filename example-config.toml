# herdr-switcher-plus configuration.
#
# Copy to the directory `herdr plugin config-dir cgardner.herdr-switcher-plus`
# prints, as config.toml. Every setting is optional, and a missing file means
# the built-in layout.
#
# The vocabulary is Herdr's own: `rows` is a list of rows, each a list of
# tokens, where a token is a name or a { token, fg, bold, dim, rules } table.
# Anything you know from configuring [ui.sidebar.agents] applies here.

[ui]

# Blank lines between agents.
row_gap = 0

# The built-in layout, written out. Tokens available:
#
# BEGIN GENERATED: tokens
#   age             time since the last message
#                   gt and lt compare against this, in minutes
#   agent           the agent kind, such as claude or codex
#   branch          the branch the checkout sits on
#   cwd             the working directory, with your home written as a tilde
#   label           the space, plus the repository and branch when not already implied
#   message         the last message in the session
#   pane            the Herdr pane ID, such as w5:p1E
#   repo            the repository name, empty when the space is not a checkout
#   role            a mark showing whether you or the agent spoke last
#   space           the Herdr space name on its own
#   state_icon      a filled dot while an agent wants attention, hollow at rest
#   state_text      idle, working, blocked, done or unknown
#   terminal_title  the pane title as the terminal reports it
# END GENERATED: tokens
#
# A row after the first hangs under the first row's second column, so a
# message sits below the name it belongs to.
rows = [
  ["age", "label", "state_icon", "state_text"],
  ["role", "message"],
]

# Omitted style fields keep the contextual default, so overriding one token
# does not mean restating the whole theme. An explicit `false` does turn a
# default off.
#
# Colors accept an ANSI index as a string ("2") or a hex value ("#a6e3a1").
# An index follows your terminal theme; a hex value does not.

# --- worked examples, all commented out -------------------------------------

# Age already grades itself: green under a day, yellow under a week, muted
# after that. This reproduces it explicitly, and is the place to change the
# bands. The numbers are minutes.
#
# rows = [
#   [ { token = "age", rules = [
#       { lt = 1440,  fg = "2" },   # under a day
#       { lt = 10080, fg = "3" },   # under a week
#       { gt = 10080, fg = "8" },   # older
#     ]},
#     "label", "state_icon", "state_text" ],
#   [ "role", "message" ],
# ]

# The age was teal rather than green before the bands existed. To get it back:
#
# rows = [[{ token = "age", rules = [{ lt = 1440, fg = "6" }] }, "label",
#          "state_icon", "state_text"], ["role", "message"]]

# Make a blocked agent shout and a working one warm. Rules are ordered and the
# first match wins, so put the specific case first.
#
# rows = [
#   [ "age", "label", "state_icon",
#     { token = "state_text", rules = [
#         { equals = "blocked", fg = "#ff6188", bold = true },
#         { equals = "working", fg = "#f9e2af" },
#     ]} ],
#   [ "role", "message" ],
# ]

# One line per agent, twice as many on screen.
#
# rows = [["age", "state_icon", "label", "agent", "pane"]]

# Add the working directory on its own row.
#
# rows = [
#   ["age", "label", "state_icon", "state_text"],
#   [{ token = "cwd", dim = true }],
#   ["role", "message"],
# ]

# Pick out one repository's worktrees from the rest.
#
