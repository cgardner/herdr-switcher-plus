id = "cgardner.herdr-switcher-plus"
name = "herdr-switcher-plus"
version = "0.1.1"

# Verified against 0.9.1. Needs `agent_session` in the session snapshot, which
# carries the Claude Code session UUID this plugin matches transcripts on.
min_herdr_version = "0.9.0"
description = "An agent switcher with several orderings. Sorts by last real message, by what needs attention, by space or by age, and jumps to the pane you pick."
platforms = ["macos", "linux"]

# A GitHub install fetches the prebuilt binary for the platform and compiles
# only when no release asset matches, so the Go toolchain is a fallback rather
# than a requirement. `plugin link` users run `make build` by hand.
[[build]]
command = ["bash", "scripts/install.sh"]

# The picker. A popup keeps the surrounding layout visible, which matters when
# the point of the list is deciding where to go next.
[[panes]]
id = "recent"
title = "agents by last message"
placement = "popup"
width = "88%"
height = "80%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-switcher-plus\""]

# The actions re-enter this binary with --open rather than calling
# `herdr plugin pane open` directly. A manifest pane's placement, width and
# height are fixed, so the only way they can be settings is for the action to
# read the config and pass them on the command line.
[[actions]]
id = "open"
title = "switcher+: agents by last message"
contexts = ["global", "workspace", "pane"]
description = "Open the switcher in the view the config names, the list by default."
command = [
  "sh",
  "-c",
  "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-switcher-plus\" --open",
]

# The list, whatever view the config names.
[[actions]]
id = "open-list"
title = "switcher+: agents as a list"
contexts = ["global", "workspace", "pane"]
description = "Open the switcher as a list of agents, newest message first."
command = [
  "sh",
  "-c",
  "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-switcher-plus\" --open --view list",
]

# A triage entry point. The pane entrypoint has one fixed command, so the
# starting sort travels as an environment variable rather than an argument.
# The attention sort belongs to the list, so this opens the list whatever view
# the config names.
[[actions]]
id = "open-attention"
title = "switcher+: agents that need attention"
contexts = ["global", "workspace", "pane"]
description = "Open the switcher with blocked agents first."
command = [
  "sh",
  "-c",
  "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-switcher-plus\" --open --view list --sort attention",
]

# The tree view: repository, then workspace, then every pane, shells included.
# It opens the tree whatever view the config names. The view travels as an
# environment variable for the same reason the sort does.
[[actions]]
id = "open-tree"
title = "switcher+: every pane as a tree"
contexts = ["global", "workspace", "pane"]
description = "Open the switcher as a tree of repository, workspace and pane, with keys to open, rename and close them, and a panel for named sessions."
command = [
  "sh",
  "-c",
  "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-switcher-plus\" --open --view tree",
]
